<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2a4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>WIN Apoio</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" />
  <style>
    :root {
      --bg:#0f1720; --card:#182230; --line:#2a3b50; --text:#e8eef6;
      --muted:#8aa0b8; --accent:#f4d35e; --up:#3dd68c; --down:#ff6b7a; --orange:#e09a4a;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); padding:12px 12px 88px; }
    h1 { font-size:1.1rem; margin:0 0 2px; }
    .sub { color:var(--muted); font-size:.75rem; margin:0 0 12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
    .sec { font-size:.7rem; letter-spacing:.08em; color:var(--accent); font-weight:700; margin-bottom:8px; }
    .sec.night { color:var(--orange); }
    label { display:block; font-size:.76rem; color:var(--muted); margin:8px 0 4px; }
    input, select, textarea { width:100%; background:#101820; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:16px; }
    textarea { min-height:64px; }
    .pctrow { display:grid; grid-template-columns:1fr 48px; gap:6px; align-items:center; }
    .minus { height:44px; border:1px solid var(--line); border-radius:8px; background:#3a1820; color:var(--down); font-size:22px; font-weight:700; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .kpi { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    .kpi div { background:#101820; border-radius:8px; padding:8px; font-size:.75rem; color:var(--muted); }
    .kpi strong { display:block; color:var(--text); font-size:1rem; }
    .hypo { text-align:center; padding:14px 8px; border-radius:12px; border:1px solid var(--accent); background:#1c2838; }
    .hypo b { display:block; font-size:1.15rem; color:var(--accent); margin-bottom:4px; }
    button.primary, button.ghost { width:100%; border:0; border-radius:10px; padding:12px; font-weight:700; font-size:15px; margin-top:8px; }
    button.primary { background:var(--accent); color:#1a1400; }
    button.ghost { background:#101820; color:var(--text); border:1px solid var(--line); }
    button.danger { background:#3a1820; color:var(--down); border:1px solid #633; width:auto; padding:6px 10px; font-size:12px; margin:0; }
    .nav { position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); background:#121c28; border-top:1px solid var(--line); padding:6px 4px env(safe-area-inset-bottom); }
    .nav button { background:none; border:0; color:var(--muted); font-size:.68rem; padding:8px 2px; }
    .nav button.on { color:var(--accent); font-weight:700; }
    .page { display:none; } .page.on { display:block; }
    .row-hist { border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:8px; font-size:.8rem; }
    .row-hist .dt { color:var(--accent); font-weight:700; }
    .tag { display:inline-block; font-size:.68rem; padding:2px 6px; border-radius:6px; margin-right:4px; background:#101820; }
    .tag.up { color:var(--up); } .tag.dn { color:var(--down); } .tag.ok { color:var(--accent); }
    .warn { color:var(--muted); font-size:.74rem; line-height:1.45; }
    table { width:100%; border-collapse:collapse; font-size:.72rem; }
    th, td { border-bottom:1px solid var(--line); padding:6px 4px; text-align:left; }
  </style>
</head>
<body>
  <h1>WIN Apoio</h1>
  <p class="sub">Caderno 18/09 · score ponderado · manhã grava sem o close</p>
  <section id="p-pre" class="page on"></section>
  <section id="p-hist" class="page"></section>
  <section id="p-busca" class="page"></section>
  <section id="p-pex" class="page"></section>
  <nav class="nav">
    <button class="on" data-p="p-pre">Hoje</button>
    <button data-p="p-hist">Mês</button>
    <button data-p="p-busca">Padrões</button>
    <button data-p="p-pex">PEX</button>
  </nav>

  {data:"2026-09-04",spx:0.0102,ndx:0.0116,djia:0.008,rut:0.007,vix:14.32,vixp:-0.0579,dxy:-0.0069,ewz:0.0011,pbr:-0.0168,vale:-0.0267,usd:0.0035,usdN:5.108,winD1:187706,winOpen:187870,winClose:187410,hipo:"GAP→"},
  {data:"2026-09-08",spx:-0.0042,ndx:-0.0012,djia:-0.003,rut:-0.004,vix:14.53,vixp:0,dxy:0.0027,ewz:-0.0071,pbr:-0.019,vale:-0.0026,usd:0.0039,usdN:5.128,winD1:187410,winOpen:190480,winClose:189835,hipo:"GAP↑",notas:"Pós 07/09 B3 + Labor Day"},
  {data:"2026-09-09",spx:-0.0054,ndx:-0.0041,djia:-0.005,rut:-0.006,vix:15.72,vixp:0.0819,dxy:-0.0039,ewz:0.0198,pbr:0.0353,vale:0.019,usd:-0.0084,usdN:5.086,winD1:189835,winOpen:189550,winClose:188016,hipo:"GAP→"},

  {data:"2026-09-21",spx:0.0016,ndx:0.004,djia:-0.0019,rut:0,vix:14.81,vixp:0,dxy:-0.0004,ewz:-0.0041,pbr:0,vale:0,usd:0.0011,usdN:5.13,winD1:186745,winOpen:187980,winClose:187845,hipo:"GAP↑",notas:"Focus · gap +1235 · IBOV +0,74%"}
];

function pctIn(v){ if(v===""||v==null||isNaN(+v)) return 0; return +v/100; }
function pctOut(f){ if(f==null||f==="") return ""; return +(f*100).toFixed(3); }
function num(id){ const el=document.getElementById(id); return el? +String(el.value).replace(",",".") : 0; }
function txt(id){ const el=document.getElementById(id); return el? el.value : ""; }

function scoreOf(r){
  return (r.spx||0)+(r.ndx||0)+(r.djia||0)+(r.rut||0)
    +1.5*(r.ewz||0)+(r.pbr||0)+(r.vale||0)
    -1.2*(r.dxy||0)-1.2*(r.usd||0)-0.4*(r.vixp||0);
}
function sugestao(sc){
  if(sc>=0.08) return "GAP↑";
  if(sc<=-0.08) return "GAP↓";
  return "GAP→";
}
function dirReal(gap){
  if(gap==null||gap==="") return "";
  if(gap>150) return "↑";
  if(gap<-150) return "↓";
  return "→";
}
function acerto(hipo, gap){
  if(!hipo || gap==null || gap==="") return "";
  const abs = Math.abs(gap);
  if(hipo==="GAP→") return abs<400 ? "SIM" : "NÃO";
  if(hipo==="GAP↑") return gap>150 ? "SIM" : "NÃO";
  if(hipo==="GAP↓") return gap<-150 ? "SIM" : "NÃO";
  return "";
}
function enrich(r){
  const gap = (r.winOpen&&r.winD1) ? r.winOpen-r.winD1 : null;
  r.gap = gap;
  r.score = +scoreOf(r).toFixed(5);
  r.dir = dirReal(gap);
  r.acerto = acerto(r.hipo, gap);
  r.status = r.winClose ? "DIA FECHADO" : "MANHÃ GRAVADA";
  return r;
}

function loadDB(){
  const raw = localStorage.getItem(KEY);
  if(raw){ try { return JSON.parse(raw).map(enrich); } catch(e){} }
  const db = SEED.map(x => enrich({...x}));
  localStorage.setItem(KEY, JSON.stringify(db));
  return db;
}
function saveDB(db){ localStorage.setItem(KEY, JSON.stringify(db.map(enrich))); }

function readMorning(){
  const r = {
    data: txt("data") || new Date().toISOString().slice(0,10),
    spx:pctIn(num("spx")), ndx:pctIn(num("ndx")), djia:pctIn(num("djia")), rut:pctIn(num("rut")),
    vix:num("vix")||null, vixp:pctIn(num("vixp")),
    dxy:pctIn(num("dxy")), ewz:pctIn(num("ewz")), pbr:pctIn(num("pbr")), vale:pctIn(num("vale")),
    usd:pctIn(num("usd")), usdN:num("usdN")||null,
    winD1:num("winD1")||null, winOpen:num("winOpen")||null, winClose:num("winClose")||null,
    hipo: txt("hipoMan"), notas: txt("notas"),
    res5: txt("res5"), pts: txt("pts"), minis: txt("minis")
  };
  if(!r.hipo) r.hipo = sugestao(scoreOf(r));
  return enrich(r);
}

function calc(){
  const r = readMorning();
  const win = r.winD1||0;
  const sc = r.score;
  const hip = sugestao(sc);
  const faixa = hip==="GAP↓" ? (win-800)+" a "+(win-200)
    : hip==="GAP↑" ? (win+200)+" a "+(win+800)
    : (win-200)+" a "+(win+200);
  const h = document.getElementById("hipoBox");
  if(!h) return;
  h.innerHTML = "<b>"+hip+" · score "+sc+"</b>Faixa "+faixa;
  const sel = document.getElementById("hipoMan");
  if(sel && !sel.dataset.touched) sel.value = hip;
}

function renderPre(){
  const el = document.getElementById("p-pre");
  const today = new Date().toISOString().slice(0,10);
  el.innerHTML = `
    <div class="card">
      <div class="sec">MANHÃ — salva agora (Ctrl não precisa; use o botão)</div>
      <div class="grid2">
        <div><label>Data B3</label><input id="data" type="date" value="${today}"></div>
        <div><label>WIN prev close (ajuste)</label><input id="winD1" inputmode="numeric" placeholder="186745"></div>
      </div>
    </div>
    <div class="card">
      <div class="sec">1–6 · % COMO NO INVESTING (0,44 e não 0,0044)</div>
      <p class="warn">Toque <b>−</b> se o teclado do celular não tiver sinal. DXY e USD já entram negativos no score.</p>
      <div id="itens"></div>
      <div class="grid2">
        <div><label>2. VIX nível</label><input id="vix" inputmode="decimal" placeholder="14.81"></div>
        <div><label>6. USD/BRL nível</label><input id="usdN" inputmode="decimal" placeholder="5.13"></div>
      </div>
    </div>
    <div class="card">
      <div class="sec">7 · HIPÓTESE — antes do leilão</div>
      <div class="hypo" id="hipoBox"><b>—</b></div>
      <label>Hipótese (pode trocar a sugestão)</label>
      <select id="hipoMan"><option>GAP↑</option><option>GAP→</option><option>GAP↓</option></select>
      <label>Evento / notas da manhã</label>
      <input id="notas" placeholder="Focus / Fed / sexta / —">
      <button class="primary" id="btnManha">Gravar MANHÃ no mês</button>
      <p class="warn">A manhã não some se você não voltar. Status = MANHÃ GRAVADA até ter o close.</p>
    </div>
    <div class="card">
      <div class="sec night">NOITE — 4 campos. Pode ficar vazio.</div>
      <div class="grid2">
        <div><label>WIN abertura 09:01</label><input id="winOpen" inputmode="numeric"></div>
        <div><label>WIN fechamento</label><input id="winClose" inputmode="numeric"></div>
      </div>
      <label>8. 1º 5m / resultado (só depois do close da 15m)</label>
      <input id="res5" placeholder="lado C/V · entrada · saída">
      <div class="grid2">
        <div><label>Pts scalp</label><input id="pts" inputmode="numeric"></div>
        <div><label>Nº minis</label><input id="minis" inputmode="numeric" value="1"></div>
      </div>
      <button class="ghost" id="btnNoite">Completar NOITE na mesma data</button>
    </div>`;
  const box = el.querySelector("#itens");
  FIELDS.forEach(it => {
    const d = document.createElement("div");
    d.innerHTML = `<label>${it.n}</label>
      <div class="pctrow">
        <input type="text" inputmode="decimal" placeholder="ex. -0.35" data-pct="${it.id}" id="${it.id}" autocomplete="off">
        <button type="button" class="minus" data-neg="${it.id}">−</button>
      </div>`;
    box.appendChild(d);
  });
  box.addEventListener("input", e => {
    const inp = e.target.closest("input"); if(!inp) return;
    inp.value = String(inp.value).replace(",",".");
    calc();
  });
  box.addEventListener("click", e => {
    const neg = e.target.closest("[data-neg]"); if(!neg) return;
    const inp = document.getElementById(neg.dataset.neg);
    if(!inp) return;
    const v = String(inp.value||"").replace(",",".");
    inp.value = (!v||v==="-") ? "-" : (v.startsWith("-") ? v.slice(1) : "-"+v);
    calc();
  });
  ["winD1","vix","usdN"].forEach(id => el.querySelector("#"+id).addEventListener("input", calc));
  el.querySelector("#hipoMan").addEventListener("change", () => { el.querySelector("#hipoMan").dataset.touched="1"; });
  el.querySelector("#btnManha").onclick = () => upsert(readMorning(), false);
  el.querySelector("#btnNoite").onclick = () => upsert(readMorning(), true);
  calc();
}

function upsert(rec, night){
  const db = loadDB();
  const i = db.findIndex(x => x.data === rec.data);
  if(i>=0){
    if(!night){
      const keep = {winClose: db[i].winClose, res5: db[i].res5, pts: db[i].pts, minis: db[i].minis, winOpen: db[i].winOpen};
      db[i] = enrich(Object.assign(keep, rec, {winClose: keep.winClose, res5: rec.res5||keep.res5, pts: rec.pts||keep.pts, winOpen: rec.winOpen||keep.winOpen}));
    } else {
      db[i] = enrich(Object.assign(db[i], {
        winOpen: rec.winOpen||db[i].winOpen,
        winClose: rec.winClose||db[i].winClose,
        res5: rec.res5||db[i].res5,
        pts: rec.pts||db[i].pts,
        minis: rec.minis||db[i].minis,
        notas: rec.notas||db[i].notas
      }));
    }
  } else db.push(rec);
  db.sort((a,b)=> a.data<b.data?1:-1);
  saveDB(db);
  alert(night ? "Noite gravada." : "Manhã gravada no mês. Status: "+(rec.winClose?"DIA FECHADO":"MANHÃ GRAVADA"));
  renderHist(); renderBusca();
}

function renderHist(){
  const db = loadDB().slice().sort((a,b)=> a.data<b.data?1:-1);
  const el = document.getElementById("p-hist");
  const n = db.length;
  const ok = db.filter(x=>x.acerto==="SIM").length;
  const withGap = db.filter(x=>x.gap!=null);
  el.innerHTML = `<div class="card"><div class="sec">SET/OUT · ${n} linhas</div>
    <div class="kpi"><div>Acertos<strong>${ok}/${withGap.filter(x=>x.hipo).length}</strong></div>
    <div>Manhã sem close<strong>${db.filter(x=>!x.winClose).length}</strong></div></div>
    <p class="warn">Azul da planilha = manhã. Laranja = noite. Não apague linha sem close.</p></div>` +
    db.map(r => `<div class="row-hist">
      <span class="dt">${r.data}</span>
      <span class="tag ${r.hipo==="GAP↑"?"up":r.hipo==="GAP↓"?"dn":""}">${r.hipo||"—"}</span>
      <span class="tag">${r.dir||"—"}</span>
      <span class="tag ${r.acerto==="SIM"?"ok":""}">${r.acerto||r.status}</span>
      <div>score ${r.score} · prev ${r.winD1||"—"} · open ${r.winOpen||"—"} · gap ${r.gap??"—"} · close ${r.winClose||"—"}</div>
      <div class="warn">${r.notas||""} ${r.res5||""}</div>
      <button class="danger" data-del="${r.data}">apagar</button>
    </div>`).join("");
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    if(!confirm("Apagar "+b.dataset.del+"?")) return;
    saveDB(loadDB().filter(x=>x.data!==b.dataset.del));
    renderHist(); renderBusca();
  });
}

function renderBusca(){
  const el = document.getElementById("p-busca");
  el.innerHTML = `<div class="card">
    <div class="sec">DIAS COMO HOJE</div>
    <label>Hipótese / gap real</label>
    <select id="fHipo"><option value="">todos</option><option>GAP↑</option><option>GAP↓</option><option>GAP→</option></select>
    <button class="primary" id="btnB">Consultar</button>
    <div id="res"></div>
  </div>
  <div class="card">
    <div class="sec">RESET / IMPORTAR</div>
    <button class="ghost" id="btnReset">Restaurar SET 01–21/09 da planilha</button>
    <p class="warn">Score = SPX+NDX+DJIA+RUT + 1,5×EWZ + PBR + VALE − 1,2×DXY − 1,2×USD − 0,4×ΔVIX.<br>
    Sugestão: ≥ +0,08 GAP↑ · ≤ −0,08 GAP↓ · senão GAP→.<br>
    Acerto: ↑ se gap&gt;+150 · ↓ se gap&lt;−150 · → se |gap|&lt;400.</p>
  </div>`;
  const run = () => {
    const f = document.getElementById("fHipo").value;
    let db = loadDB();
    if(f) db = db.filter(x => x.hipo===f || x.dir===(f==="GAP↑"?"↑":f==="GAP↓"?"↓":"→"));
    const n = db.length;
    const fill = db.filter(x => x.acerto==="SIM").length;
    document.getElementById("res").innerHTML = `
      <div class="kpi"><div>N<strong>${n}</strong></div><div>Acerto hipótese<strong>${n?Math.round(100*fill/n):0}%</strong></div></div>
      <table><thead><tr><th>Data</th><th>Hipo</th><th>Gap</th><th>Acerto</th></tr></thead>
      <tbody>${db.slice(0,16).map(r=>`<tr><td>${r.data}</td><td>${r.hipo}</td><td>${r.gap??"—"}</td><td>${r.acerto||"—"}</td></tr>`).join("")}</tbody></table>`;
  };
  el.querySelector("#btnB").onclick = run;
  el.querySelector("#fHipo").onchange = run;
  el.querySelector("#btnReset").onclick = () => { localStorage.setItem(KEY, JSON.stringify(SEED)); renderHist(); run(); };
  run();
}

function renderPex(){
  document.getElementById("p-pex").innerHTML = `<div class="card">
    <div class="sec">MODELO DO CADERNO</div>
    <p class="warn">Sistema de apoio à decisão para mini índice (WIN), sem execução automática: checklist pré-market, registro da sessão e frequência histórica de padrões (gap + 1ª vela de 15m).</p>
    <p class="warn">3 camadas: HOJE (esta aba) → linha do MÊS → noite laranja. Folha de hoje não é o arquivo final.</p>
    <p class="warn">Filtro = close da 1ª de 15m. 5m só depois. 1 mini. Score não é ordem.</p>
  </div>`;
}

renderPre(); renderHist(); renderBusca(); renderPex();
document.querySelectorAll(".nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById(b.dataset.p).classList.add("on");
  };
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script>
